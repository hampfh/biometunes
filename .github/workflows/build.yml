name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build packageSoundpack verifyDistributionArchives
      - uses: actions/upload-artifact@v4
        with:
          name: biometunes-fabric
          path: apps/mod/build/libs/biometunes-1.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: biometunes-soundpack
          path: build/distributions/biometunes-soundpack-1.0.0.zip
